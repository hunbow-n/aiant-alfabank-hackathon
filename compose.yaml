services:
  app:
    build: .
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      - CHAT_ASSISTANT_KEY_HASH=${CHAT_ASSISTANT_KEY_HASH:-}
      - ALFAGEN_API_KEY=${ALFAGEN_API_KEY:-}
      - ALFAGEN_MODEL=${ALFAGEN_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5